<!DOCTYPE html>
<html>
<head>
  <title>profil sawi</title>
  <style>
    body{
      background-color:#2c2c54;
      font-family: Arial;
    }

    .card{
      width:300px;
      background:#3d3d8f;
      margin:100px auto;
      padding:15px;
      border-radius:15px;
      text-align:center;
      color:white;
    }

    .card img{
      width:80px;
      height:80px;
      border-radius:50%;
    }

    h2{
      margin:10px 0 5px;
    }

    p{
      font-size:13px;
      color:#ddd;
    }

    a{
      display:block;
      background:#6c5ce7;
      margin:8px;
      padding:8px;
      border-radius:8px;
      text-decoration:none;
      color:white;
    }

    a:hover{
      background:#a29bfe;
    }

    .merah{
      background:#e84118;
    }

    .meme{
      margin-top:15px;
    }

    .meme img{
      width:100%;
      border-radius:10px;
    }

    .ket{
      font-size:12px;
      margin-top:5px;
    }
  </style>
</head>

<body>

<div class="card">
  <img src="sawi.jpg.jpg">

  <h2>ini sawi</h2>
  <p>suka mie ayam, kadang ngoding kalo inget 😭</p>

  <a href="#">github (jarang buka)</a>
  <a href="#">instagram (lebih aktif)</a>
  <a href="#" class="merah">ayo makan mie ayam 🍜</a>

  <div class="meme">
    <img src="Mie Ayam🤤🤤.jpeg">
    <div class="ket">niat diet tapi liat mie ayam: yaudah besok aja 🤡</div>
  </div>

</div>

</body>
</html>
